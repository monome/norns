name: 'Build norns'
description: 'Build norns in a dev container'
inputs:
  GITHUB_TOKEN:
    description: 'GitHub token for GHCR access'
    required: true

runs:
  using: "composite"
  steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.GITHUB_TOKEN }}
    - name: Build inside dev container and update GHCR
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/monome/norns-ci
        cacheFrom: ghcr.io/monome/norns-ci
        push: filter
        refFilterForPush: refs/heads/main
        runCmd: ./waf configure --release && ./waf build --release
